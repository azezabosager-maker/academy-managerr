<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14213d">
  <title>Academy Manager</title>
  <style>
    :root {
      --navy: #14213d;
      --blue: #2563eb;
      --bg: #f3f6fb;
      --white: #fff;
      --green: #15803d;
      --red: #dc2626;
      --orange: #c2410c;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Tahoma, Arial, sans-serif; background: var(--bg); color: #1e293b; }
    [hidden] { display: none !important; }
    header { background: var(--navy); color: white; padding: 18px 22px; }
    .header-inner, main { max-width: 1200px; margin: auto; }
    .header-inner { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    header h1 { margin: 0 0 6px; font-size: 23px; }
    header p { margin: 0; color: #cbd5e1; font-size: 13px; }
    main { padding: 20px 16px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; }
    button:disabled { cursor: wait; opacity: .65; }
    .primary { background: var(--blue); color: white; }
    .secondary { background: #e2e8f0; color: #1e293b; }
    .danger { background: #fee2e2; color: #b91c1c; }
    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 18px; }
    .card, .panel { background: var(--white); border-radius: 13px; padding: 18px; box-shadow: 0 3px 12px #0f172a0a; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-number { font-size: 28px; font-weight: bold; margin-top: 10px; }
    .panel { margin-bottom: 18px; }
    .panel h2 { margin: 0 0 16px; font-size: 18px; }
    .form-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 13px; }
    .field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
    .field label { font-size: 13px; color: #475569; }
    .field input, .field select, .field textarea, #search, .toolbar select, .auth-panel input {
      width: 100%; min-width: 0; padding: 10px; border: 1px solid #cbd5e1;
      border-radius: 8px; background: white; color: #1e293b;
    }
    .field textarea { min-height: 42px; resize: vertical; }
    .form-actions, .toolbar, .inline-controls { display: flex; gap: 9px; align-items: center; flex-wrap: wrap; }
    .form-actions { margin-top: 16px; }
    .toolbar { justify-content: space-between; margin-bottom: 13px; }
    .toolbar h2 { margin: 0; }
    #search { max-width: 340px; }
    .inline-controls label { color: var(--muted); font-size: 13px; }
    .inline-controls input, .inline-controls select { padding: 8px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; min-width: 850px; }
    th, td { padding: 11px 9px; border-bottom: 1px solid var(--border); text-align: right; vertical-align: middle; font-size: 13px; }
    th { background: #f8fafc; color: #475569; white-space: nowrap; }
    .badge { display: inline-block; padding: 5px 9px; border-radius: 20px; font-size: 12px; white-space: nowrap; }
    .active { background: #dcfce7; color: var(--green); }
    .expiring { background: #ffedd5; color: var(--orange); }
    .expired { background: #fee2e2; color: var(--red); }
    .actions { display: flex; gap: 5px; }
    .actions button { padding: 7px 9px; font-size: 12px; white-space: nowrap; }
    .student-cell { display: flex; align-items: center; gap: 8px; min-width: 150px; }
    .avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; background: #e2e8f0; }
    .empty, .notice { text-align: center; color: var(--muted); padding: 22px; }
    .notice { font-size: 12px; line-height: 1.7; padding: 10px 0 0; }
    .status-message { margin: 10px 0; color: #b91c1c; font-size: 13px; white-space: pre-wrap; }
    .modal { position: fixed; inset: 0; z-index: 5; background: #0f172a88; display: grid; place-items: center; padding: 16px; }
    .modal-card { width: min(560px, 100%); max-height: 90vh; overflow: auto; background: white; border-radius: 14px; padding: 20px; }
    .modal-card h2 { margin: 0 0 14px; }
    .payment-total { font-weight: bold; color: var(--navy); }
    .auth-panel { max-width: 720px; margin: 36px auto; }
    .auth-panel summary { cursor: pointer; color: var(--navy); font-weight: bold; }
    @media(max-width: 850px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media(max-width: 520px) {
      main { padding: 14px 10px; } header { padding: 16px; } header h1 { font-size: 20px; }
      .stats { gap: 9px; } .card, .panel { padding: 13px; } .stat-number { font-size: 24px; }
      .form-grid { grid-template-columns: 1fr; } #search { max-width: none; }
      .toolbar { align-items: stretch; } .toolbar > * { width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div><h1>Academy Manager</h1><p id="subtitle"></p></div>
      <div class="form-actions" style="margin:0">
        <button class="secondary" id="languageButton" type="button">English</button>
        <span id="signedInUser" style="color:white" hidden></span>
        <button class="secondary" id="importLocalButton" type="button" hidden></button>
        <button class="secondary" id="signOutButton" type="button" hidden></button>
      </div>
    </div>
  </header>

  <main>
    <section id="authView" hidden>
      <section class="panel auth-panel">
        <h2 id="authTitle"></h2>
        <p id="authNotice" class="notice"></p>
        <form id="configForm">
          <h3 id="configTitle"></h3>
          <div class="form-grid">
            <div class="field"><label id="projectUrlLabel" for="projectUrl"></label><input id="projectUrl" type="url" autocomplete="url" required></div>
            <div class="field"><label id="publicKeyLabel" for="publicKey"></label><input id="publicKey" type="password" autocomplete="off" required></div>
          </div>
          <div class="form-actions"><button class="primary" id="saveConfigButton" type="submit"></button></div>
        </form>
        <button class="secondary" id="changeConfigButton" type="button" hidden></button>
        <div id="authControls" hidden>
          <form id="authForm">
            <div class="form-grid">
              <div class="field"><label id="usernameLabel" for="username"></label><input id="username" autocomplete="username" maxlength="30" required></div>
              <div class="field"><label id="passwordLabel" for="password"></label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required></div>
            </div>
            <div class="form-actions">
              <button class="primary" id="signInButton" type="submit"></button>
              <button class="secondary" id="signUpButton" type="button"></button>
            </div>
          </form>
          <details class="panel" style="margin-top:16px;box-shadow:none;padding:0">
            <summary id="recoveryTitle"></summary>
            <p id="recoveryNotice" class="notice"></p>
            <form id="recoveryForm">
              <div class="form-grid">
                <div class="field"><label id="recoveryUsernameLabel" for="recoveryUsername"></label><input id="recoveryUsername" maxlength="30" autocomplete="off" required></div>
                <div class="field"><label id="recoveryPasswordLabel" for="recoveryPassword"></label><input id="recoveryPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required></div>
                <div class="field"><label id="recoveryKeyLabel" for="recoveryKey"></label><input id="recoveryKey" type="password" minlength="32" autocomplete="off" required></div>
              </div>
              <div class="form-actions"><button class="primary" id="recoveryButton" type="submit"></button></div>
            </form>
          </details>
        </div>
        <p id="authMessage" class="status-message" role="alert"></p>
      </section>
    </section>
    <section id="appView" hidden>
      <section class="stats">
        <div class="card"><div class="stat-label" id="totalLabel"></div><div class="stat-number" id="totalCount">0</div></div>
        <div class="card"><div class="stat-label" id="activeLabel"></div><div class="stat-number" id="activeCount">0</div></div>
        <div class="card"><div class="stat-label" id="expiredLabel"></div><div class="stat-number" id="expiredCount">0</div></div>
        <div class="card"><div class="stat-label" id="expiringLabel"></div><div class="stat-number" id="expiringCount">0</div></div>
      </section>

      <section class="panel">
        <div class="toolbar">
          <h2 id="studentFormTitle"></h2>
          <button class="secondary" id="cancelEditButton" type="button" hidden></button>
        </div>
        <form id="studentForm">
          <div class="form-grid">
            <div class="field"><label id="nameLabel" for="name"></label><input id="name" maxlength="100" required></div>
            <div class="field"><label id="phoneLabel" for="phone"></label><input id="phone" type="tel" maxlength="30"></div>
            <div class="field"><label id="guardianLabel" for="guardian"></label><input id="guardian" maxlength="100"></div>
            <div class="field"><label id="guardianPhoneLabel" for="guardianPhone"></label><input id="guardianPhone" type="tel" maxlength="30"></div>
            <div class="field"><label id="sportLabel" for="sport"></label>
              <select id="sport"><option value="تايكواندو">تايكواندو</option><option value="كاراتيه">كاراتيه</option><option value="كيك بوكسينغ">كيك بوكسينغ</option><option value="أخرى">أخرى</option></select>
            </div>
            <div class="field"><label id="trainingDaysLabel" for="trainingDays"></label><input id="trainingDays" maxlength="100"></div>
            <div class="field"><label id="coachLabel" for="coach"></label><input id="coach" maxlength="100"></div>
            <div class="field"><label id="levelLabel" for="level"></label><input id="level" maxlength="50"></div>
            <div class="field"><label id="startLabel" for="start"></label><input id="start" type="date" required></div>
            <div class="field"><label id="monthsLabel" for="months"></label>
              <select id="monthsType"><option value="1">1</option><option value="3">3</option><option value="6">6</option><option value="12">12</option><option value="custom"></option></select>
            </div>
            <div class="field" id="customMonthsWrap" hidden><label id="customMonthsLabel" for="customMonths"></label><input id="customMonths" type="number" min="1" max="120" value="1"></div>
            <div class="field"><label id="endLabel" for="endPreview"></label><input id="endPreview" readonly></div>
            <div class="field"><label id="priceLabel" for="price"></label><input id="price" type="number" min="0" step="0.01" value="30" required></div>
            <div class="field" id="paidWrap"><label id="paidLabel" for="paid"></label><input id="paid" type="number" min="0" step="0.01" value="0"></div>
            <div class="field" id="dueDateWrap" hidden>
              <label id="dueDateLabel" for="dueDate"></label><input id="dueDate" type="date">
              <span class="notice" id="dueDateHint"></span>
            </div>
            <div class="field"><label id="photoLabel" for="photo"></label><input id="photo" type="file" accept="image/*"></div>
            <div class="field"><label id="notesLabel" for="notes"></label><textarea id="notes" maxlength="500"></textarea></div>
          </div>
          <div class="form-actions"><button class="primary" id="saveButton" type="submit"></button></div>
          <p class="notice" id="formNotice"></p>
          <p class="status-message" id="formMessage" role="alert"></p>
        </form>
      </section>

      <section class="panel">
        <div class="toolbar"><h2 id="studentsTitle"></h2><input id="search" type="search"></div>
        <div class="table-wrap"><table><thead><tr>
          <th id="thStudent"></th><th id="thPhone"></th><th id="thSport"></th><th id="thStart"></th>
          <th id="thEnd"></th><th id="thDueDate"></th><th id="thStatus"></th><th id="thPrice"></th><th id="thPaid"></th><th id="thActions"></th>
        </tr></thead><tbody id="studentList"></tbody></table></div>
        <div class="form-actions">
          <button class="secondary" id="exportButton" type="button"></button>
          <button class="secondary" id="importButton" type="button"></button>
          <input id="importFile" type="file" accept=".json,application/json" hidden>
        </div>
        <p class="notice" id="storageNotice"></p>
      </section>

      <section class="panel">
        <div class="toolbar"><h2 id="accountsTitle"></h2></div>
        <div class="inline-controls">
          <label id="revenueFrequencyLabel" for="revenueFrequency"></label>
          <select id="revenueFrequency">
            <option value="month"></option>
            <option value="quarter"></option>
            <option value="year"></option>
          </select>
          <label id="revenueYearLabel" for="revenueYear"></label>
          <input id="revenueYear" type="number" min="2000" max="2100" step="1">
          <label id="revenueSlotLabel" for="revenueSlot"></label>
          <select id="revenueSlot"></select>
        </div>
        <p><span id="revenuePeriodLabel"></span>: <span id="revenuePeriod"></span></p>
        <p><span id="revenueTotalLabel"></span>: <strong class="payment-total" id="revenueTotal">0.00 JOD</strong></p>
        <p><span id="revenueCountLabel"></span>: <strong id="revenueCount">0</strong></p>
        <p><span id="expenseTotalLabel"></span>: <strong id="expenseTotal">0.00 JOD</strong></p>
        <p><span id="netTotalLabel"></span>: <strong class="payment-total" id="netTotal">0.00 JOD</strong></p>
        <p class="notice" id="revenueNotice"></p>
        <h3 id="addExpenseTitle"></h3>
        <form id="expenseForm">
          <div class="form-grid">
            <div class="field"><label id="expenseCategoryLabel" for="expenseCategory"></label>
              <select id="expenseCategory">
                <option value="rent"></option><option value="salaries"></option>
                <option value="electricity"></option><option value="sportsEquipment"></option>
                <option value="miscellaneous"></option>
              </select>
            </div>
            <div class="field"><label id="expenseAmountLabel" for="expenseAmount"></label><input id="expenseAmount" type="number" min="0.01" step="0.01" required></div>
            <div class="field"><label id="expenseDateLabel" for="expenseDate"></label><input id="expenseDate" type="date" required></div>
            <div class="field"><label id="expenseDescriptionLabel" for="expenseDescription"></label><input id="expenseDescription" maxlength="200"></div>
          </div>
          <div class="form-actions"><button class="primary" id="saveExpenseButton" type="submit"></button></div>
          <p class="status-message" id="expenseMessage" role="alert"></p>
        </form>
        <h3 id="expenseListTitle"></h3>
        <div class="table-wrap"><table><thead><tr>
          <th id="expenseDateTh"></th><th id="expenseCategoryTh"></th><th id="expenseDescriptionTh"></th>
          <th id="expenseAmountTh"></th><th id="expenseActionsTh"></th>
        </tr></thead><tbody id="expenseList"></tbody></table></div>
      </section>

      <section class="panel">
        <div class="toolbar"><h2 id="paymentsTitle"></h2>
          <div class="inline-controls"><label id="periodLabel" for="periodStart"></label><input id="periodStart" type="date">
            <span id="periodToLabel"></span><input id="periodEnd" type="date"><button class="secondary" id="periodButton" type="button"></button></div>
        </div>
        <p><span id="periodTotalLabel"></span>: <span class="payment-total" id="periodTotal">0.00 JOD</span></p>
        <div class="table-wrap"><table><thead><tr><th id="payStudentTh"></th><th id="payDateTh"></th><th id="payAmountTh"></th><th id="payTermTh"></th><th id="payActionsTh"></th></tr></thead><tbody id="paymentList"></tbody></table></div>
      </section>
      <p class="status-message" id="appMessage" role="alert"></p>
    </section>
  </main>

  <div class="modal" id="renewModal" hidden>
    <div class="modal-card">
      <h2 id="renewTitle"></h2>
      <form id="renewForm">
        <div class="form-grid">
          <div class="field"><label id="renewStartLabel" for="renewStart"></label><input id="renewStart" type="date" required></div>
          <div class="field"><label id="renewMonthsLabel" for="renewMonthsType"></label>
            <select id="renewMonthsType"><option value="1">1</option><option value="3">3</option><option value="6">6</option><option value="12">12</option><option value="custom"></option></select>
          </div>
          <div class="field" id="renewCustomWrap" hidden><label id="renewCustomLabel" for="renewCustom"></label><input id="renewCustom" type="number" min="1" max="120" value="1"></div>
          <div class="field"><label id="renewEndLabel" for="renewEnd"></label><input id="renewEnd" readonly></div>
          <div class="field"><label id="renewPriceLabel" for="renewPrice"></label><input id="renewPrice" type="number" min="0" step="0.01" required></div>
          <div class="field"><label id="renewPaidLabel" for="renewPaid"></label><input id="renewPaid" type="number" min="0" step="0.01" value="0"></div>
          <div class="field" id="renewDueDateWrap" hidden>
            <label id="renewDueDateLabel" for="renewDueDate"></label><input id="renewDueDate" type="date">
            <span class="notice" id="renewDueDateHint"></span>
          </div>
        </div>
        <div class="form-actions"><button class="primary" id="renewSaveButton" type="submit"></button><button class="secondary" id="renewCancelButton" type="button"></button></div>
        <p class="status-message" id="renewMessage" role="alert"></p>
      </form>
    </div>
  </div>

  <div class="modal" id="paymentModal" hidden>
    <div class="modal-card">
      <h2 id="paymentModalTitle"></h2>
      <form id="paymentForm">
        <div class="form-grid">
          <div class="field"><label id="paymentModalAmountLabel" for="paymentAmount"></label><input id="paymentAmount" type="number" min="0.01" step="0.01" required></div>
          <div class="field"><label id="paymentModalDateLabel" for="paymentDate"></label><input id="paymentDate" type="date" required></div>
        </div>
        <div class="form-actions"><button class="primary" id="paymentSaveButton" type="submit"></button><button class="secondary" id="paymentCancelButton" type="button"></button></div>
        <p class="status-message" id="paymentMessage" role="alert"></p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>

        miscellaneous:"نثريات", noExpenses:"لا توجد مصاريف في هذه الفترة.", invalidExpense:"أدخل قيمة موجبة وتاريخًا صحيحًا للمصروف.",
        deleteExpense:"حذف المصروف", confirmDeleteExpense:"هل تريد حذف هذا المصروف؟",
        months:["كانون الثاني","شباط","آذار","نيسان","أيار","حزيران","تموز","آب","أيلول","تشرين الأول","تشرين الثاني","كانون الأول"],
        quarters:["الربع الأول","الربع الثاني","الربع الثالث","الربع الرابع"],
        paymentsTitle:"الدفعات", period:"الفترة من", to:"إلى", apply:"تطبيق", periodTotal:"إجمالي المبالغ المدفوعة خلال الفترة",
        paymentStudent:"الطالب", paymentDate:"تاريخ الدفع", paymentAmount:"المبلغ المدفوع", paymentTerm:"مدة الاشتراك",

    function parseDate(value) {

      const year = start.getFullYear() + Math.floor(index/12);

          const payload=JSON.parse(atob(keyValue.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")));
          if (payload.role !== "anon") return null;
        }
        return {url:url.origin,key:keyValue};
      } catch {
        return null;
      }
    }

    async function fetchAllRows(table,orderColumn) {
      const pageSize=1000;
      const rows=[];
      for (let offset=0;;offset+=pageSize) {
        const {data,error}=await supabaseClient.from(table).select("*")
          .order(orderColumn,{ascending:false}).order("id",{ascending:true})
          .range(offset,offset+pageSize-1);
        if (error) throw error;
        rows.push(...(data || []));
        if (!data || data.length<pageSize) return rows;
      }
    }
    async function saveCloudChanges(previous,next) {
      const tables=["students","subscriptions","payments","expenses"];
      for (const table of tables) {
        const before=previous[table];
        const after=next[table];
        const beforeById=new Map(before.map(row=>[row.id,row]));
        const changed=after.filter(row=>!beforeById.has(row.id) ||
          JSON.stringify(beforeById.get(row.id))!==JSON.stringify(row));
        if (!changed.length) continue;
        for (let offset=0;offset<changed.length;offset+=200) {
          const batch=changed.slice(offset,offset+200).map(row=>({...row,owner_id:currentUser.id}));
          const {error}=await supabaseClient.from(table).upsert(batch,{onConflict:"id"});
          if (error) throw error;
        }
      }
      for (const table of ["payments","subscriptions","expenses","students"]) {
        const before=previous[table];
        const after=next[table];
        const afterIds=new Set(after.map(row=>row.id));
        const removed=before.filter(row=>!afterIds.has(row.id));
        if (!removed.length) continue;
        const ids=removed.map(row=>row.id);
        for (let offset=0;offset<ids.length;offset+=200) {
          const {error}=await supabaseClient.from(table).delete().in("id",ids.slice(offset,offset+200));
          if (error) throw error;
        }
      }
    }

    function revenueDateRange() {
      const year=Number($("revenueYear").value);
      if (!Number.isInteger(year) || year < 2000 || year > 2100) return null;
      const frequency=$("revenueFrequency").value;
      if (frequency==="year") return {start:`${year}-01-01`,end:`${year}-12-31`};
      const slot=Number($("revenueSlot").value);
      if (!Number.isInteger(slot) || slot < 1 || slot > (frequency==="quarter" ? 4 : 12)) return null;
      const firstMonth=frequency==="quarter" ? (slot-1)*3+1 : slot;
      const lastMonth=frequency==="quarter" ? firstMonth+2 : firstMonth;
      const start=`${year}-${String(firstMonth).padStart(2,"0")}-01`;
      const endDay=new Date(year,lastMonth,0).getDate();
      const end=`${year}-${String(lastMonth).padStart(2,"0")}-${String(endDay).padStart(2,"0")}`;
      return {start,end};
    }

    function validateSubscription(start,months,price,paid,dueDate="",requireDueDate=false) {

      if (!Number.isFinite(price) || price < 0) throw new Error(t("invalidPrice"));

    async function resizePhoto(file) {
      if (!file) return null;
      if (!file.type.startsWith("image/")) throw new Error(t("photoError"));
      if (file.size > 5 * 1024 * 1024) throw new Error(t("photoTooLarge"));
      const image = await new Promise((resolve,reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error(t("photoError")));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error(t("photoError")));
          img.onload = () => resolve(img);
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
      const scale = Math.min(1,400/Math.max(image.width,image.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1,Math.round(image.width*scale));
      canvas.height = Math.max(1,Math.round(image.height*scale));
      const context=canvas.getContext("2d");
      if (!context) throw new Error(t("photoError"));
      context.drawImage(image,0,0,canvas.width,canvas.height);
      return canvas.toDataURL("image/jpeg",0.75);
    }

            validateSubscription(start,months,price,currentPaid,dueDate,true);

          const updatedSubscriptions=currentSubscription
            ? subscriptions.map(subscription => subscription.id === currentSubscription.id
              ? {...subscription,due_date:hasUnpaidBalance(subscription,currentPaid) ? dueDate : null}
              : subscription)
            : subscriptions;
          await persistData(updatedStudents,updatedSubscriptions);
        } else {
          const studentId=crypto.randomUUID();

            id:subscriptionId,student_id:studentId,start_date:start,months,
            end_date:addMonths(start,months),price,due_date:price > paid ? dueDate : null,
            created_at:new Date().toISOString()

            id:crypto.randomUUID(),student_id:studentId,subscription_id:subscriptionId,
            amount:paid,paid_at:todayString(),created_at:new Date().toISOString()
          } : null;
          receiptPaymentId=initialPayment?.id || null;

          await persistData([...students,student],[subscription,...subscriptions],newPayments);
        }
        resetStudentForm();

    }
    function resetStudentForm() {
      editingId = null;
      $("studentForm").reset();
      $("cancelEditButton").hidden = true;
      $("start").value = todayString();
      $("price").value = "30";
      $("paid").value = "0";
      $("dueDate").value = "";
      $("customMonthsWrap").hidden = true;
      $("paidWrap").hidden = false;
      updateDueDateField();
      $("photo").value = "";
      for (const id of ["start","monthsType","customMonths","price"]) $(id).disabled = false;
      $("formMessage").textContent = "";
      $("endPreview").value = addMonths($("start").value,1);
      applyLanguage();
    }
    function editStudent(id) {
      const student = students.find(item => item.id === id);
      const sub = latestSubscription(id);
      if (!student) return;
      editingId = id;
      $("cancelEditButton").hidden = false;
      for (const [input,key] of [["name","name"],["phone","phone"],["guardian","guardian"],["guardianPhone","guardian_phone"],["sport","sport"],["trainingDays","training_days"],["coach","coach"],["level","level"],["notes","notes"]]) $(input).value = student[key] || "";
      $("start").value = sub ? sub.start_date : todayString();
      $("price").value = sub ? sub.price : "0";
      $("paidWrap").hidden = true;
      $("dueDate").value = sub?.due_date || "";
      $("monthsType").value = sub && ["1","3","6","12"].includes(String(sub.months)) ? String(sub.months) : sub ? "custom" : "1";
      $("customMonths").value = sub ? sub.months : "1";
      $("customMonthsWrap").hidden = $("monthsType").value !== "custom";
      $("endPreview").value = sub ? sub.end_date : "";
      $("photo").value = "";
      for (const input of ["start","monthsType","customMonths","price"]) $(input).disabled = true;
      updateDueDateField();
      applyLanguage();
      window.scrollTo({top:0,behavior:"smooth"});
    }
    async function deleteStudent(id) {
      if (!confirm(t("confirmDelete"))) return;
      try {
        await persistData(
          students.filter(student => student.id !== id),
          subscriptions.filter(subscription => subscription.student_id !== id),
          payments.filter(payment => payment.student_id !== id)
        );
        if (editingId === id) resetStudentForm();
        render();
      } catch (error) { showError("appMessage",friendlyError(error)); }
    }
    function openRenew(id) {
      renewingStudent = students.find(s => s.id === id);
      if (!renewingStudent) return;
      $("renewForm").reset();
      $("renewStart").value = todayString();
      $("renewPrice").value = latestSubscription(id)?.price || 0;
      $("renewPaid").value = "0";
      $("renewDueDate").value = "";
      $("renewMonthsType").value = "1";
      $("renewCustomWrap").hidden = true;
      $("renewEnd").value = addMonths($("renewStart").value,1);
      updateDueDateField("renew");
      $("renewMessage").textContent = "";
      $("renewModal").hidden = false;
    }
    async function saveRenewal(event) {
      event.preventDefault();
      showError("renewMessage","");
      const button = $("renewSaveButton");
      button.disabled = true;
      try {
        const months = monthsValue("renew");
        const price = Number($("renewPrice").value);
        const paid = Number($("renewPaid").value || 0);
        const start = $("renewStart").value;
        const dueDate=$("renewDueDate").value;
        validateSubscription(start,months,price,paid,dueDate,true);
        const subscriptionId=crypto.randomUUID();
        const subscription={
          id:subscriptionId,student_id:renewingStudent.id,start_date:start,months,
          end_date:addMonths(start,months),price,due_date:price > paid ? dueDate : null,
          created_at:new Date().toISOString()
        };
        const renewalPayment=paid > 0 ? {
          id:crypto.randomUUID(),student_id:renewingStudent.id,subscription_id:subscriptionId,
          amount:paid,paid_at:todayString(),created_at:new Date().toISOString()
        } : null;
        const newPayments=renewalPayment ? [renewalPayment,...payments] : payments;
        await persistData(students,[subscription,...subscriptions],newPayments);
        $("renewModal").hidden = true;
        render();
        showError("appMessage",t("renewed"));
        offerReceiptPrint(renewalPayment?.id);
      } catch (error) { showError("renewMessage",friendlyError(error,t("loadError"))); }
      finally { button.disabled = false; }
    }
    function printReceipt(paymentId) {
      const payment=payments.find(item=>item.id===paymentId);
      const student=payment && students.find(item=>item.id===payment.student_id);
      const subscription=payment && subscriptions.find(item=>item.id===payment.subscription_id);
      if (!payment || !student || !subscription) {
        showError("appMessage",t("loadError"));
        return;
      }
      const printWindow=window.open("","_blank","width=720,height=800");
      if (!printWindow) {
        showError("appMessage",t("receiptPopupError"));
        return;
      }
      const row=(label,value)=>`<div class="row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "—")}</strong></div>`;
      const receipt=`<!DOCTYPE html><html lang="${language}" dir="${language==="ar" ? "rtl" : "ltr"}"><head><meta charset="UTF-8"><title>${escapeHtml(t("receiptTitle"))}</title>
        <style>
          body{font-family:Tahoma,Arial,sans-serif;color:#14213d;margin:0;padding:32px}
          .receipt{max-width:640px;margin:auto;border:2px solid #14213d;border-radius:12px;padding:28px}
          h1{text-align:center;margin:0 0 8px;font-size:26px}.number{text-align:center;color:#64748b;margin-bottom:24px}
          .row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid #e2e8f0}
          .row strong{text-align:left}.paid{font-size:20px;color:#15803d;border:0;margin-top:10px}
          footer{text-align:center;color:#64748b;margin-top:28px}
          @media print{body{padding:0}.receipt{border:1px solid #14213d;border-radius:0}}
        </style></head><body><main class="receipt"><h1>${escapeHtml(t("receiptTitle"))}</h1>
        <div class="number">${escapeHtml(t("receiptNumber"))}: ${escapeHtml(payment.id.slice(0,8).toUpperCase())}</div>
        ${row(t("receiptDate"),formatDate(payment.paid_at))}
        ${row(t("student"),student.name)}
        ${row(t("receiptGuardian"),student.guardian)}
        ${row(t("receiptGuardianPhone"),student.guardian_phone)}
        ${row(t("receiptSport"),sportName(student.sport))}
        ${row(t("receiptCoach"),student.coach)}
        ${row(t("receiptTrainingDays"),student.training_days)}
        ${row(t("receiptStatement"),t("receiptSubscription"))}
        ${row(t("receiptValidFrom"),formatDate(subscription.start_date))}
        ${row(t("receiptValidUntil"),formatDate(subscription.end_date))}
        <div class="row paid"><span>${escapeHtml(t("receiptPaid"))}</span><strong>${normalizeMoney(payment.amount)} ${escapeHtml(t("receiptCurrency"))}</strong></div>
        <footer>${escapeHtml(t("receiptThanks"))}</footer></main></body></html>`;
      printWindow.document.open();
      printWindow.document.write(receipt);
      printWindow.document.close();
      setTimeout(()=>printWindow.print(),250);
      showError("appMessage","");
    }
    function offerReceiptPrint(paymentId) {
      if (paymentId && confirm(t("printReceiptPrompt"))) printReceipt(paymentId);
    }
    function openPayment(id) {
      payingStudent = students.find(student => student.id === id);
      if (!payingStudent || !latestSubscription(id)) return;
      $("paymentForm").reset();
      $("paymentDate").value = todayString();
      $("paymentMessage").textContent = "";
      $("paymentModal").hidden = false;
    }
    async function savePayment(event) {
      event.preventDefault();
      showError("paymentMessage","");
      const amount = Number($("paymentAmount").value);
      const paidAt = $("paymentDate").value;
      const subscription = latestSubscription(payingStudent?.id);
      if (!payingStudent || !subscription || !Number.isFinite(amount) || amount <= 0 || !parseDate(paidAt)) {
        showError("paymentMessage",t("invalidPayment"));
        return;
      }
      const button = $("paymentSaveButton");
      button.disabled = true;
      try {
        const payment={
          id:crypto.randomUUID(),student_id:payingStudent.id,subscription_id:subscription.id,
          amount,paid_at:paidAt,created_at:new Date().toISOString()
        };
        await persistData(students,subscriptions,[payment,...payments]);
        updateDueDateField();
        $("paymentModal").hidden = true;
        render();
        showError("appMessage",t("saved"));
        offerReceiptPrint(payment.id);
      } catch (error) { showError("paymentMessage",friendlyError(error,t("loadError"))); }
      finally { button.disabled = false; }
    }
    async function exportBackup() {
      try {
        const content = {app:"Academy Manager",version:6,exportedAt:new Date().toISOString(),students,subscriptions,payments,expenses};
        const blob = new Blob([JSON.stringify(content,null,2)],{type:"application/json"});
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href=url;a.download="academy-manager-backup.json";a.click();
        setTimeout(() => URL.revokeObjectURL(url),1000);
      } catch (error) { showError("appMessage",friendlyError(error,t("exportError"))); }
    }
    async function importBackup(file) {
      if (!file) return;
      try {
        const data = JSON.parse(await file.text());
        if (!data || !Array.isArray(data.students)) throw new Error(t("importError"));
        if (!confirm(t("importConfirm"))) return;
        const studentIds = new Map();
        const subscriptionIds = new Map();
        const importedStudents=[];
        const importedSubscriptions=[];
        const importedPayments=[];
        const importedExpenses=[];
        for (const student of data.students) {
          if (!student || typeof student.id !== "string" || typeof student.name !== "string") throw new Error(t("importError"));
          const id=crypto.randomUUID();
          const photo=student.photo_data || student.photo || "";
          importedStudents.push({
            id,name:student.name,phone:student.phone || "",guardian:student.guardian || "",
            guardian_phone:student.guardian_phone || student.guardianPhone || "",sport:student.sport || "أخرى",
            training_days:student.training_days || student.trainingDays || "",
            coach:student.coach || "",level:student.level || "",notes:student.notes || "",
            photo_data:typeof photo === "string" && photo.startsWith("data:image/") ? photo : "",
            created_at:student.created_at || student.createdAt || new Date().toISOString()
          });
          if (student.id) studentIds.set(student.id,id);
        }
        const oldSubscriptions=Array.isArray(data.subscriptions) ? data.subscriptions : [];
        for (const student of data.students) {
          const newStudentId=studentIds.get(student.id);
          const history=oldSubscriptions.filter(item => item.student_id === student.id)
            .sort((a,b) => String(b.created_at || b.start_date).localeCompare(String(a.created_at || a.start_date)));
          for (const oldSub of history) {
            const months=Number(oldSub.months);
            const price=Number(oldSub.price || 0);
            validateSubscription(oldSub.start_date,months,price,0);
            const id=crypto.randomUUID();
            importedSubscriptions.push({
              id,student_id:newStudentId,start_date:oldSub.start_date,months,price,
              end_date:addMonths(oldSub.start_date,months),due_date:oldSub.due_date || null,
              created_at:oldSub.created_at || new Date().toISOString()
            });
            subscriptionIds.set(oldSub.id,id);
          }
          if (!history.length) {
            const type=String(student.type || "");
            const months=type === "custom" ? Number(student.customMonths) : Number(type);
            if (type !== "sessions" && parseDate(student.start) && Number.isInteger(months) && months >= 1 && months <= 120) {
              const id=crypto.randomUUID();
              const price=Number(student.price || 0);
              const paid=Number(student.paid || 0);
              validateSubscription(student.start,months,price,paid);
              importedSubscriptions.push({
                id,student_id:newStudentId,start_date:student.start,months,price,
                end_date:addMonths(student.start,months),created_at:student.created_at || new Date().toISOString()
              });
              if (paid > 0) importedPayments.push({
                id:crypto.randomUUID(),student_id:newStudentId,subscription_id:id,amount:paid,
                paid_at:todayString(),created_at:new Date().toISOString()
              });
              if (student.id) subscriptionIds.set(student.id,id);
            }
          }
        }
        for (const oldPayment of data.payments || []) {
          const studentId=studentIds.get(oldPayment.student_id);
          const subscriptionId=subscriptionIds.get(oldPayment.subscription_id);
          if (!studentId || !subscriptionId) continue;
          const amount=Number(oldPayment.amount);
          if (!Number.isFinite(amount) || amount <= 0 || !parseDate(oldPayment.paid_at)) throw new Error(t("importError"));
          importedPayments.push({
            id:crypto.randomUUID(),student_id:studentId,subscription_id:subscriptionId,
            amount,paid_at:oldPayment.paid_at,created_at:oldPayment.created_at || new Date().toISOString()
          });
        }
        for (const oldExpense of Array.isArray(data.expenses) ? data.expenses : []) {
          if (!oldExpense || typeof oldExpense !== "object") throw new Error(t("importError"));
          const amount=Number(oldExpense.amount);
          if (
            !Object.prototype.hasOwnProperty.call(translations.ar,String(oldExpense.category)) ||
            !Number.isFinite(amount) || amount<=0 ||
            !parseDate(oldExpense.date)
          ) throw new Error(t("importError"));
          importedExpenses.push({
            id:crypto.randomUUID(),category:oldExpense.category,amount,date:oldExpense.date,
            description:String(oldExpense.description || "").slice(0,200),
            created_at:oldExpense.created_at || new Date().toISOString()
          });
        }
        await persistData(
          [...students,...importedStudents],
          [...subscriptions,...importedSubscriptions],
          [...payments,...importedPayments],
          [...expenses,...importedExpenses]
        );
        render();
        showError("appMessage",t("imported"));
        return true;
      } catch (error) {
        showError("appMessage",friendlyError(error,t("importError")));
        return false;
      }
      finally { $("importFile").value=""; }
    }

    $("languageButton").addEventListener("click",() => {
      language = language === "ar" ? "en" : "ar";
      localStorage.setItem("academyManager.language",language);
      applyLanguage();
    });
    $("configForm").addEventListener("submit",saveCloudConfig);
    $("changeConfigButton").addEventListener("click",()=>{
      const config=JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY) || "{}");
      $("projectUrl").value=config.url || "";
      $("publicKey").value=config.key || "";
      supabaseClient=null;
      $("authControls").hidden=true;
      $("configForm").hidden=false;
      $("changeConfigButton").hidden=true;
      showAuthMessage("");
    });
    $("authForm").addEventListener("submit",signIn);
    $("signUpButton").addEventListener("click",signUp);
    $("recoveryForm").addEventListener("submit",resetAccountPassword);
    $("signOutButton").addEventListener("click",signOut);
    $("importLocalButton").addEventListener("click",importLocalBackup);
    $("studentForm").addEventListener("submit",saveStudent);
    $("renewForm").addEventListener("submit",saveRenewal);
    $("renewCancelButton").addEventListener("click",() => $("renewModal").hidden=true);
    $("paymentForm").addEventListener("submit",savePayment);
    $("expenseForm").addEventListener("submit",saveExpense);
    $("paymentCancelButton").addEventListener("click",() => $("paymentModal").hidden=true);
    $("paymentList").addEventListener("click",event=>{
      const button=event.target.closest("button[data-action='receipt']");
      if (button) printReceipt(button.dataset.id);
    });
    $("monthsType").addEventListener("change",() => { $("customMonthsWrap").hidden=$("monthsType").value!=="custom";refreshEndDate.call($("monthsType")); });
    $("customMonths").addEventListener("input",() => refreshEndDate.call($("monthsType")));
    $("start").addEventListener("input",() => refreshEndDate.call($("monthsType")));
    $("price").addEventListener("input",updateDueDateField);
    $("paid").addEventListener("input",updateDueDateField);
    $("renewMonthsType").addEventListener("change",() => { $("renewCustomWrap").hidden=$("renewMonthsType").value!=="custom";refreshEndDate.call($("renewMonthsType")); });
    $("renewCustom").addEventListener("input",() => refreshEndDate.call($("renewMonthsType")));
    $("renewStart").addEventListener("input",() => refreshEndDate.call($("renewMonthsType")));
    $("renewPrice").addEventListener("input",() => updateDueDateField("renew"));
    $("renewPaid").addEventListener("input",() => updateDueDateField("renew"));
    $("search").addEventListener("input",renderStudents);
    $("periodButton").addEventListener("click",renderPayments);
    $("revenueFrequency").addEventListener("change",() => {
      updateRevenueSlotOptions();
      renderRevenue();
    });
    $("revenueSlot").addEventListener("change",renderRevenue);
    $("revenueYear").addEventListener("input",renderRevenue);
    $("expenseList").addEventListener("click",event=>{
      const button=event.target.closest("button[data-action='delete-expense']");
      if (button) deleteExpense(button.dataset.id);
    });
    $("studentList").addEventListener("click",event => {
      const button=event.target.closest("button[data-action]");
      if (!button) return;
      const {action,id}=button.dataset;
      if (action==="edit") editStudent(id);
      if (action==="renew") openRenew(id);
      if (action==="payment") openPayment(id);
      if (action==="delete") deleteStudent(id);
    });
    $("cancelEditButton").addEventListener("click",resetStudentForm);
    $("exportButton").addEventListener("click",exportBackup);
    $("importButton").addEventListener("click",() => $("importFile").click());
    $("importFile").addEventListener("change",event => importBackup(event.target.files[0]));
    $("renewModal").addEventListener("click",event => { if (event.target === $("renewModal")) $("renewModal").hidden=true; });
    $("paymentModal").addEventListener("click",event => { if (event.target === $("paymentModal")) $("paymentModal").hidden=true; });
    window.addEventListener("focus",()=>{if(currentUser) scheduleCloudReload();});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden && currentUser) scheduleCloudReload();});
    (async function init() {
      $("start").value=todayString();
      $("endPreview").value=addMonths($("start").value,1);
      $("periodStart").value=`${new Date().getFullYear()}-01-01`;
      $("periodEnd").value=todayString();
      $("revenueYear").value=new Date().getFullYear();
      $("expenseDate").value=todayString();
      applyLanguage();
      updateDueDateField();
      try {
        await initializeCloudAuth();
      } catch (error) {
        showSignedOut(friendlyError(error,t("authConnectionError")));
      }
    })();
    setInterval(()=>{if(currentUser) render();},60000);
  </script>
</body>
</html>
